<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>室內棒球聯盟年度會議｜棒球維基館</title>

<style>
body {
  margin: 0;
  font-family: "Noto Sans TC", sans-serif;
  background: #ffffff;
  color: #111827;
  line-height: 1.6;
}

a {
  color: #1d4ed8;
  text-decoration: none;
}
a:hover { text-decoration: underline; }

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

/* ===== 橫幅照片 ===== */
.banner-photo {
  width: 100%;
  height: 320px;
  background-color: #e5e7eb;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #6b7280;
  font-size: 1.2rem;
  margin-bottom: 20px;
}

/* ===== 頁首 ===== */
.header {
  margin-bottom: 24px;
}

.header h1 {
  margin: 0;
  font-size: 2rem;
}

.header .sub {
  font-size: 0.9rem;
  color: #4b5563;
}

/* ===== 區塊 ===== */
.section {
  margin-bottom: 28px;
}

.section h2 {
  font-size: 1.1rem;
  margin-bottom: 10px;
  border-left: 4px solid #111827;
  padding-left: 8px;
}


/* ===== 基本資料 ===== */
.profile div {
  padding: 6px 0;
  border-bottom: 1px solid #e5e7eb;
}
.profile span {
  width: 120px;
  display: inline-block;
  font-weight: 600;
}

.profile div {
  display: flex;
  gap: 12px;
}

.profile span {
  flex: 0 0 120px; /* 固定欄寬 */
}

.profile div > :not(span) {
  flex: 1;
}


/* ===== 連結不換行 ===== */
.no-break {
  white-space: nowrap;
}

/* ===== 頂部導覽列 ===== */
.topnav {
  display: flex;
  gap: 10px;
  padding: 12px 0;
  border-bottom: 3px solid #e5e7eb;
  margin-bottom: 10px;
  font-size: 0.85rem;
}

.topnav a {
  color: #006000;
  font-weight:450;
}

.topnav a:hover {
  color: #1d4ed8;
}

/* ===== 球隊速查表 ===== */
table.state {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  font-size: 0.85em;
}

table.state th,
table.state td {
  padding: 6px 8px;
  text-align: center;
  border-bottom: 1px solid #ddd;
}

table.state th {
  background: #46A3FF;
  color: #FFFFFF;
  font-weight: 600;
}

table.state tbody tr:nth-child(even) td {
  background: #ECF5FF;
}

table.state th:nth-child(2),
table.state td:nth-child(2) {
  white-space: nowrap;
}

/* ===== 重要決策欄位專用樣式 ===== */
table.team td:nth-child(4),
table.team th:nth-child(4) {
  text-align: left;        /* 左對齊 */
  vertical-align: top;     /* 文字從上開始 */
  line-height: 1.6;
  padding: 8px 10px;
}

table.team td:nth-child(4) {
  max-width: 420px;
}



/* ===== 年度賽況整體 ===== */
.season-wrapper {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "Noto Sans TC", sans-serif;
  max-width: 1000px;
  margin: 0 auto;
}

/* ===== 十年切換按鈕 ===== */
.decade-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
}

.decade-tabs button {
  padding: 8px 14px;
  border: 1px solid #ccc;
  background: #f5f5f5;
  cursor: pointer;
  border-radius: 4px;
  font-size: 14px;
}

.decade-tabs button.active {
  background: #1f2937;
  color: #fff;
  border-color: #1f2937;
}

/* ===== 十年內容區 ===== */
.decade-content {
  display: none;
}

.decade-content.active {
  display: block;
}

/* ===== 球衣專區 ===== */
.section img {
  max-width: 280px;
  width: 100%;
  height: auto;
  display: block;
}

.logo {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  margin-top: 12px;
}

.logo img {
  width: 100%;
  max-width: 280px;   /* ← 關鍵數字 */
  height: auto;
  display: block;
}


/* ===== 年度列表 ===== */
.season-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 10px;
}

.season-list a {
  display: block;
  padding: 10px;
  text-align: center;
  border: 1px solid #ddd;
  border-radius: 4px;
  text-decoration: none;
  color: #111;
  background: #fff;
  font-size: 14px;
}

.season-list a:hover {
  background: #f0f4f8;
  border-color: #999;
}

</style>
</head>
