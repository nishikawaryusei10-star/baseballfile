<!-- 全螢幕遮罩層 -->
<div id="page-loader">
  <div class="loader-content">
    <!-- 這裡放你的可愛圖案 -->
    <img src="https://memeprod.sgp1.digitaloceanspaces.com/user-wtf/1590328655860.jpg" alt="Loading...">
    <p>正在載入中...</p>
  </div>
</div>

<style>
  #page-loader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: #ffffff; /* 轉場背景色 */
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 99999; /* 確保在最上層 */
    transition: opacity 0.5s ease, visibility 0.5s;
  }

  .loader-content {
    text-align: center;
  }

  .loader-content img {
    width: 120px; /* 調整可愛圖片的大小 */
    margin-bottom: 15px;
  }

  /* 當載入完成後隱藏的樣式 */
  .loader-hidden {
    opacity: 0;
    visibility: hidden;
  }
</style>

<script>
  // 監聽視窗載入事件
  window.addEventListener('load', function() {
    var loader = document.getElementById('page-loader');
    // 增加一點點延遲感，讓轉場更自然 (例如 500 毫秒)
    setTimeout(function() {
      loader.classList.add('loader-hidden');
    }, 500);
  });
</script>
