<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2051年球季打擊數據統計</title>
  
  <!-- 引入 CSS 檔案 -->
  <link rel="stylesheet" href="../css/states.css">
</head>
<body>

<div class="container">
  <div class="control-card">
    <div class="title-group">
      <h1>2051年球季打擊數據統計</h1>
      <p>點擊欄位標頭可進行降冪/升冪排序</p>
    </div>
    <label class="filter-group">
      <input type="checkbox" id="qualifiedFilter" checked onchange="renderTable()">
      <span>僅顯示達規定打席 (≥ 465 PA)</span>
    </label>
  </div>

  <div class="table-card">
    <div class="table-container">
      <table class="stats-table">
        <thead>
          <tr id="tableHeader"></tr>
        </thead>
        <tbody id="statsBody">
          <tr><td colspan="21" style="padding: 40px; color: var(--text-muted);">載入最新數據中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- 引入 JavaScript 檔案 -->
<script src="../js/main.js"></script>

</body>
</html>
