<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | 我的個人網站</title>

    <!-- 這裡引入你原本的 CSS 檔案，路徑請依照你的專案修改 -->
    <link rel="stylesheet" href="/assets/css/style.css">

    <!-- 如果有其他字體或套件也可以放這 -->
</head>
<body>

    <!-- 1. 調用我們剛做好的可愛轉場畫面 -->
    {% include loader.html %}

    <!-- 2. 導覽列 (選填，如果每頁都要出現就放這) -->
    <nav>
        <a href="/">首頁</a>
        <a href="/about.html">關於我</a>
    </nav>

    <main>
        <!-- 3. 【最重要】Jekyll 會把各網頁的內容填入這個位置 -->
        {{ content }}
    </main>

    <footer>
        <p>&copy; {{ "now" | date: "%Y" }} 我的 GitHub 網站</p>
    </footer>

</body>
</html>
