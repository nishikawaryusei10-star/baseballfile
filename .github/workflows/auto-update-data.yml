name: Auto Update Search Data

on:
  push:
    branches:
      - main  # 或是你的主要分支名稱
    paths:
      - 'players/**'
      - 'teams/**'
      - 'stadium/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run script
        run: python generate_data.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto-update data.json from GitHub Actions" || exit 0
          git push
