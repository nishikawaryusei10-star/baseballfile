<style>

/* ===== 橫幅照片 ===== */

  padding-left: 8px;
}

/* ===== 基本資料 ===== */
.profile {
  font-size: 0.95rem;
}

.profile div {
  display: flex;    
  padding: 5px 0;
  border-bottom: 1px solid #e5e7eb;
}

.profile-content {
  display: flex;
  flex-direction: column;
}

.profile span {
  display: inline-block;
  width: 100px;
  font-weight: 600;
  color: #374151;
}

/* ===== 經歷 ===== */

  display: inline-block;
}

.no-break {

table.stats {
  width: 100%;

  margin-top: 10px;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  font-size: 0.85em;
}

table.stats th,
table.stats td {
  padding: 6px 8px;
  text-align: center;
  border-bottom: 1px solid #ddd;
}

table.stats th {
  background: #c70125;
  color: #FFFFFF;
  font-weight: 600;
}

table.stats tbody tr:nth-child(even) td {
  background: #F8D9DE;
}

/* ===== 表格 ===== */

table.stats1 th,
table.stats1 td {
